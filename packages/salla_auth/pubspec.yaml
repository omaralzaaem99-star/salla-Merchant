name: salla_auth
description: Shared authentication and identity layer for the Salla applications.
publish_to: none

version: 1.0.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_app_check: ^0.4.5+2
  firebase_core: ^4.10.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  cloud_functions: ^6.3.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
