workflows:
  ios-release:
    name: Salla iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - salaaa
        certificates:
          - SallaDistribution

      vars:
        APP_STORE_APPLE_ID: "6819366483"

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          flutter pub get

      - name: Set up iOS signing
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/sala_store"

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"

          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            IOS_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          fi

          echo "iOS build number: $IOS_BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify IPA
        script: |
          IPA_PATH="$(find "$CM_BUILD_DIR/sala_store/build/ios/ipa" -type f -name "*.ipa" | head -n 1)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA file was not generated."
            find "$CM_BUILD_DIR/sala_store/build/ios" -maxdepth 4 -type f
            exit 1
          fi

          echo "IPA found:"
          echo "$IPA_PATH"

          mkdir -p "$CM_BUILD_OUTPUT_DIR"
          cp "$IPA_PATH" "$CM_BUILD_OUTPUT_DIR/"

          ls -lh "$CM_BUILD_OUTPUT_DIR"

    artifacts:
      - $CM_BUILD_OUTPUT_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
