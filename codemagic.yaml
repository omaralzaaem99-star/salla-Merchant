workflows:
  ios-release:
    name: Salla iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - salaaa
        certificates:
          - SallaDistribution

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          flutter pub get

      - name: Set up iOS signing
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/sala_store"

          IOS_BUILD_NUMBER=$((BUILD_NUMBER + 6))

          echo "Codemagic build number: $BUILD_NUMBER"
          echo "iOS build number: $IOS_BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
