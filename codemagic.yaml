workflows:
  ios-release:
    name: Salla iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    working_directory: sala_store

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - salaaa
        certificates:
          - SallaDistribution

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/Runner.xcodeproj \
            --scheme Runner

      - name: Verify IPA
        script: |
          echo "=== IPA files ==="
          IPA_PATH=$(find "$CM_BUILD_DIR/sala_store/build/ios/ipa" -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA generated"
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA_PATH"
          ls -lh "$IPA_PATH"

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
