workflows:
  ios-release:
    name: Salla iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    working_directory: sala_store

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - salaaa
        certificates:
          - SallaDistribution

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify generated IPA
        script: |
          echo "=== IPA SEARCH ==="
          IPA_PATH=$(find "$CM_BUILD_DIR/sala_store/build/ios/ipa" -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not generated"
            find "$CM_BUILD_DIR/sala_store/build/ios" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA_PATH"
          ls -lh "$IPA_PATH"

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
