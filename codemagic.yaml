workflows:
  ios-release:
    name: Salla iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    working_directory: sala_store

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - profile: SallaPushProduction
            environment_variable: SALLA_PROFILE_PATH
        certificates:
          - SallaDistribution

      vars:
        BUNDLE_ID: "com.salllla.marchent"

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Set up iOS code signing
        script: |
          set -e
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Inspect selected provisioning profile
        script: |
          set -e

          echo "Profile path:"
          echo "$SALLA_PROFILE_PATH"

          security cms -D -i "$SALLA_PROFILE_PATH" > /tmp/salla_profile.plist

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/salla_profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/salla_profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/salla_profile.plist)
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/salla_profile.plist)
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/salla_profile.plist 2>/dev/null || true)

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Application Identifier: $APP_IDENTIFIER"
          echo "Push entitlement: $APS_ENV"

          if [[ "$APP_IDENTIFIER" != *".$BUNDLE_ID" ]]; then
            echo "ERROR: Bundle ID does not match selected provisioning profile"
            exit 1
          fi

          if [ "$APS_ENV" != "production" ]; then
            echo "ERROR: Selected profile does not contain aps-environment=production"
            exit 1
          fi

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          plutil -p ios/ExportOptions.plist

      - name: Build iOS IPA
        script: |
          set -e

          flutter build ipa --release \
            --export-options-plist="$CM_BUILD_DIR/sala_store/ios/ExportOptions.plist"

      - name: Verify IPA
        script: |
          set -e

          IPA_FILE=$(find "$CM_BUILD_DIR/sala_store/build/ios/ipa" \
            -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA NOT FOUND"
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA_FILE"
          ls -lh "$IPA_FILE"

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
