workflows:
  ios-release:
    name: Salla iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salllla.marchent

      vars:
        APP_STORE_APPLE_ID: 6819366483

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          flutter pub get

      - name: Set up iOS code signing
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest App Store build: $LATEST_BUILD_NUMBER"
          echo "New build number: $BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
