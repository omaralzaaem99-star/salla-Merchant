workflows:
  ios-release:
    name: Salla iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    working_directory: sala_store

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - salaaa
        certificates:
          - SallaDistribution

      vars:
        BUNDLE_ID: "com.salllla.marchent"

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Set up iOS code signing
        script: |
          set -e
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Prepare explicit export options
        script: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MATCHED_PROFILE=""

          echo "Searching for App Store profile for $BUNDLE_ID..."

          for PROFILE in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$PROFILE" ] || continue

            TMP_PLIST="$(mktemp)"
            security cms -D -i "$PROFILE" > "$TMP_PLIST"

            APP_IDENTIFIER=$(/usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$TMP_PLIST" 2>/dev/null || true)

            APS_ENV=$(/usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$TMP_PLIST" 2>/dev/null || true)

            if [[ "$APP_IDENTIFIER" == *".$BUNDLE_ID" ]] && \
               [[ "$APS_ENV" == "production" ]]; then

              MATCHED_PROFILE="$PROFILE"
              cp "$TMP_PLIST" /tmp/salla_profile.plist
              rm -f "$TMP_PLIST"
              break
            fi

            rm -f "$TMP_PLIST"
          done

          if [ -z "$MATCHED_PROFILE" ]; then
            echo "ERROR: No provisioning profile found for $BUNDLE_ID with aps-environment=production"
            exit 1
          fi

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" /tmp/salla_profile.plist)

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" /tmp/salla_profile.plist)

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" /tmp/salla_profile.plist)

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Push entitlement: production"

          cp /Users/builder/export_options.plist ios/ExportOptions.plist

          /usr/libexec/PlistBuddy \
            -c "Delete :teamID" \
            ios/ExportOptions.plist 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Delete :signingStyle" \
            ios/ExportOptions.plist 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Delete :provisioningProfiles" \
            ios/ExportOptions.plist 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :teamID string $TEAM_ID" \
            ios/ExportOptions.plist

          /usr/libexec/PlistBuddy \
            -c "Add :signingStyle string manual" \
            ios/ExportOptions.plist

          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles dict" \
            ios/ExportOptions.plist

          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" \
            ios/ExportOptions.plist

          echo "=== ExportOptions.plist ==="
          plutil -p ios/ExportOptions.plist

      - name: Build iOS IPA
        script: |
          set -e

          flutter build ipa --release \
            --export-options-plist="$CM_BUILD_DIR/sala_store/ios/ExportOptions.plist"

      - name: Verify IPA
        script: |
          set -e

          IPA_FILE=$(find "$CM_BUILD_DIR/sala_store/build/ios/ipa" \
            -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA WAS NOT GENERATED"
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA_FILE"
          ls -lh "$IPA_FILE"

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
