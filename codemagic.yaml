workflows:
  ios-release:
    name: Salla iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "SIQ Codemagic"

    environment:
      vars:
        BUNDLE_ID: "com.salllla.marchent"
        APP_STORE_APPLE_ID: "6819366483"

      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          flutter pub get

      - name: Initialize iOS keychain
        script: |
          keychain initialize

      - name: Fetch or create fresh Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate to keychain
        script: |
          keychain add-certificates

      - name: Apply provisioning profile
        script: |
          cd "$CM_BUILD_DIR/sala_store"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$CM_BUILD_DIR/sala_store"

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi

          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest App Store build: $LATEST_BUILD_NUMBER"
          echo "New build number: $BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - sala_store/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
